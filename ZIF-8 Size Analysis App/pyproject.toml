[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zif8-size-analysis-app"
version = "0.1.0"
description = "Authenticated browser-local web application for manual ZIF-8 SEM 3D fitting"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools]
py-modules = ["app", "create_user"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
