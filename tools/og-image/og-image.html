<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OGP source — 段上翔太郎</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, sans-serif;
  }
  body {
    position: relative;
    background-color: #fcfcfa;
    background-image:
      radial-gradient(circle at 88% 15%, rgba(23,107,96,.17), transparent 420px),
      linear-gradient(135deg, #fcfcfa, #eef4f1);
    color: #172624;
  }

  .left {
    position: absolute;
    left: 72px;
    top: 0;
    width: 568px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-size: 18px;
    color: #5d6e6a;
    letter-spacing: .06em;
    margin-bottom: 18px;
  }
  .name-ja {
    font-size: 80px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.05;
    margin-bottom: 8px;
    white-space: nowrap;
  }
  .name-en {
    font-size: 38px;
    font-weight: 600;
    color: #172624;
    margin-bottom: 22px;
    white-space: nowrap;
  }
  .rule {
    width: 64px;
    height: 3px;
    background: #176b60;
    margin-bottom: 24px;
  }
  .field-ja {
    font-size: 24px;
    font-weight: 500;
    line-height: 1.4;
    color: #172624;
    margin-bottom: 14px;
  }
  .field-en {
    font-size: 18px;
    line-height: 1.45;
    color: #5d6e6a;
    max-width: 540px;
  }
  .url {
    position: absolute;
    left: 72px;
    bottom: 56px;
    font-size: 20px;
    font-weight: 600;
    color: #176b60;
  }

  .right {
    position: absolute;
    left: 690px;
    top: 0;
    width: 438px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .card {
    width: 438px;
    height: 506px;
    border-radius: 16px;
    border: 1px solid #d9e1de;
    background: rgba(255,255,255,.6);
    padding: 20px;
    box-sizing: border-box;
  }
  .caption {
    margin-top: 16px;
    font-size: 14px;
    color: #5d6e6a;
    text-align: center;
    width: 100%;
  }
  svg#waterfall text {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, sans-serif;
  }
</style>
</head>
<body>

  <div class="left">
    <div class="eyebrow">Kyoto University · Department of Chemical Engineering</div>
    <div class="name-ja">段上 翔太郎</div>
    <div class="name-en">Shotaro Danjo</div>
    <div class="rule"></div>
    <div class="field-ja">ナノ粒子・MOF粒子の形成機構解明<br>放射光 in situ 時分割X線回折</div>
    <div class="field-en">Formation mechanisms of nanoparticles and MOFs studied by in situ time-resolved XRD</div>
  </div>
  <div class="url">shotaro-d.github.io</div>

  <div class="right">
    <div class="card">
      <svg id="waterfall" width="398" height="466" viewBox="0 0 398 466" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="caption">Time-resolved in situ XRD — schematic (ZIF-8)</div>
  </div>

<script>
(function () {
  // Plot geometry inside the 398x466 SVG viewport.
  var X0 = 34, X1 = 388;      // plot x-range (px)
  var Y0 = 22, Y1 = 432;      // plot y-range (px); Y1 is the k=0 baseline
  var THETA_MIN = 1.5, THETA_MAX = 7.5;
  var G = 40;                 // vertical offset between trace baselines
  var SCALE = 130;            // intensity -> px
  var N = 400;                // points per trace

  // ZIF-8 calculated reflections (2theta / deg, relative intensity)
  var peaks = [
    { hkl: "110", pos: 2.366, i: 100 },
    { hkl: "200", pos: 3.346, i: 22 },
    { hkl: "211", pos: 4.099, i: 42 },
    { hkl: "220", pos: 4.733, i: 12 },
    { hkl: "310", pos: 5.292, i: 20 },
    { hkl: "222", pos: 5.797, i: 30 },
    { hkl: "321", pos: 6.262, i: 8 },
    { hkl: "411", pos: 7.102, i: 10 }
  ];
  var labeledHkl = ["110", "211", "222"];

  function gaussian(x, pos, sigma) {
    var d = (x - pos) / sigma;
    return Math.exp(-0.5 * d * d);
  }
  function background(x) {
    return 0.06 * gaussian(x, 3.0, 1.6);
  }
  function sigmaFor(k) { return 0.09 - 0.055 * (k / 6); }
  function scaleFor(k) { return Math.pow(k / 6, 1.6); }
  function baselineFor(k) { return Y1 - k * G; }
  function xToPx(x) { return X0 + (x - THETA_MIN) / (THETA_MAX - THETA_MIN) * (X1 - X0); }

  function valueAt(x, k) {
    var s = scaleFor(k), sigma = sigmaFor(k);
    var v = background(x);
    for (var p = 0; p < peaks.length; p++) {
      v += s * (peaks[p].i / 100) * gaussian(x, peaks[p].pos, sigma);
    }
    return v;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerpColor(c1, c2, t) {
    var r = Math.round(lerp(c1[0], c2[0], t));
    var g = Math.round(lerp(c1[1], c2[1], t));
    var b = Math.round(lerp(c1[2], c2[2], t));
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  var COLOR_EARLY = [169, 184, 179]; // #a9b8b3
  var COLOR_LATE = [23, 107, 96];    // #176b60

  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("waterfall");

  function el(name, attrs) {
    var e = document.createElementNS(svgNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // --- static axis + arrow (drawn first, behind traces) ---
  var axisY = Y1 + 8;
  svg.appendChild(el("line", { x1: X0, y1: axisY, x2: X1, y2: axisY, stroke: "#9baca6", "stroke-width": 1 }));
  var axisLabel = el("text", { x: (X0 + X1) / 2, y: axisY + 20, "text-anchor": "middle", "font-size": 13, fill: "#5d6e6a" });
  axisLabel.textContent = "2θ / °";
  svg.appendChild(axisLabel);

  var arrowX = 16;
  var arrowTop = Y0, arrowBottom = Y1;
  svg.appendChild(el("line", { x1: arrowX, y1: arrowBottom, x2: arrowX, y2: arrowTop, stroke: "#9baca6", "stroke-width": 1 }));
  svg.appendChild(el("polygon", {
    points: (arrowX - 3.5) + "," + (arrowTop + 7) + " " + (arrowX + 3.5) + "," + (arrowTop + 7) + " " + arrowX + "," + arrowTop,
    fill: "#9baca6"
  }));
  var timeLabel = el("text", {
    x: 0, y: 0, "text-anchor": "middle", "font-size": 13, fill: "#5d6e6a",
    transform: "translate(" + (arrowX - 10) + "," + ((arrowTop + arrowBottom) / 2) + ") rotate(-90)"
  });
  timeLabel.textContent = "time";
  svg.appendChild(timeLabel);

  // --- traces, k=0 (earliest, back) .. k=6 (latest, front) ---
  for (var k = 0; k <= 6; k++) {
    var baseline = baselineFor(k);
    var pts = [];
    for (var i = 0; i < N; i++) {
      var x = THETA_MIN + (THETA_MAX - THETA_MIN) * i / (N - 1);
      var v = valueAt(x, k);
      var px = xToPx(x);
      var py = baseline - v * SCALE;
      pts.push(px.toFixed(2) + "," + py.toFixed(2));
    }
    var color = lerpColor(COLOR_EARLY, COLOR_LATE, k / 6);
    svg.appendChild(el("polyline", {
      points: pts.join(" "),
      fill: "none",
      stroke: color,
      "stroke-width": 2,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }

  // --- peak labels on the top (latest) trace ---
  var kTop = 6;
  for (var pk = 0; pk < peaks.length; pk++) {
    var pk_ = peaks[pk];
    if (labeledHkl.indexOf(pk_.hkl) === -1) continue;
    var v6 = valueAt(pk_.pos, kTop);
    var apexY = baselineFor(kTop) - v6 * SCALE;
    var lx = xToPx(pk_.pos);
    var ly = apexY - 8;
    var lbl = el("text", { x: lx, y: ly, "text-anchor": "middle", "font-size": 12, fill: "#5d6e6a" });
    lbl.textContent = pk_.hkl;
    svg.appendChild(lbl);
  }
})();
</script>
</body>
</html>
